name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up npm
      uses: actions/setup-node@v5
      with:
        # Kept in sync with .nvmrc and the `engines.node` floor in package.json.
        # @oceanprotocol/lib 9 and nautilus 2.x both require Node >= 22.
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      # `ci` rather than `install`: installs exactly what the lockfile describes and
      # fails instead of silently resolving newer versions.
      run: npm ci
