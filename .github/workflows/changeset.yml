name: Changesets
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares exactly what it needs. Only `publish` gets `id-token: write`.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be halfway through a publish.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    permissions:
      contents: read

  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # `version` when changesets are pending, `publish` when the versioned package is not
      # on npm yet, `none` otherwise.
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Create version pull request
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # Commits and pushes through the GitHub API, so no git credentials are needed.
      - name: Create version pull request
        uses: changesets/action/version@v2
        with:
          script: npm run changeset:version
          commit-message: 'chore: version package'
          pr-title: 'chore: version package'

  pack:
    name: Pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [verify, select-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Pushes the release tag and creates the GitHub release.
      contents: write
      # npm trusted publishing (OIDC). No NPM_TOKEN secret is involved.
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No dependency cache on the job that holds the publish credential.
      - name: Set up npm
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      # Publishes the tarballs from the pack job, then tags the commit and creates the
      # GitHub release. In changesets pre mode the dist-tag comes from .changeset/pre.json.
      - name: Publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
