name: Changesets
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares exactly what it needs. Only the two jobs that publish, `publish`
# and `canary-publish`, get `id-token: write`, and each runs in a GitHub environment
# whose deployment-branch policy limits which refs may reach it. npm's trusted
# publisher registration names that environment, so a publish from any other ref or
# any other environment is refused by the registry.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be halfway through a publish.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # `version` when changesets are pending, `publish` when the versioned package is not
      # on npm yet, `none` otherwise.
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Create version pull request
    if: github.ref == 'refs/heads/main' && needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # Commits and pushes through the GitHub API, so no git credentials are needed.
      - name: Create version pull request
        uses: changesets/action/version@v2
        with:
          script: npm run changeset:version
          commit-message: 'chore: version package'
          pr-title: 'chore: version package'

  pack:
    name: Pack
    if: github.ref == 'refs/heads/main' && needs.select-mode.outputs.mode == 'publish'
    needs: [verify, select-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deployment branches: main only. Registered on npm as the release trusted publisher.
    environment: npm-release
    permissions:
      # Pushes the release tag and creates the GitHub release.
      contents: write
      # npm trusted publishing (OIDC). No NPM_TOKEN secret is involved.
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No dependency cache on a job that holds the publish credential.
      - name: Set up npm
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 bundles a newer one; fail
      # loudly rather than silently install whatever `npm@latest` is on the day. Plain
      # coreutils on purpose: nothing fetched from the registry runs next to the credential.
      - name: Check npm version
        run: |
          have=$(npm --version)
          if ! printf '11.5.1\n%s\n' "$have" | sort -V -C; then
            echo "::error::npm $have is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi

      # Only @changesets/cli runs here, and it publishes the tarball from the pack job.
      # Nothing in this job needs install scripts, and no third-party script should run
      # next to the OIDC credential.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Publishes the tarballs from the pack job, then tags the commit and creates the
      # GitHub release. The dist-tag comes from the publish plan: `beta` while
      # .changeset/pre.json is in pre mode.
      - name: Publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true

  # A snapshot of every push to main, published as 0.0.0-main.<timestamp> under the
  # `main` dist-tag, i.e. `npm i @deltadao/nautilus@main`. Push events only, and skipped
  # when the same push is a real release, so the two never publish side by side. Built
  # and packed here without any credential; the publish happens in the minimal job below.
  canary-pack:
    name: Pack canary
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.select-mode.outputs.mode != 'publish'
    needs: [verify, select-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      node-version: ${{ steps.node.outputs.version }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # The publish job below has no checkout, so it cannot read .nvmrc itself.
      - name: Read Node version
        id: node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      # The branch name doubles as the dist-tag, reduced to what npm accepts in a tag.
      # Names that would land on a release channel are refused outright.
      - name: Set version
        id: version
        working-directory: src
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=$(printf '%s' "$REF_NAME" | tr -cs '[:alnum:]-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/-$//')
          case "$tag" in
            ''|latest|beta|next|alpha|rc|canary)
              echo "::error::refusing to publish a canary under dist-tag '$tag'"
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          npm version --no-git-tag-version "0.0.0-$tag.$(date -u +%Y%m%dT%H%M%S)"

      - name: Build
        run: npm run build

      - name: Pack
        working-directory: src
        run: mkdir -p ../canary && npm pack --pack-destination ../canary

      - name: Upload tarball
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: canary-tarball
          path: canary/*.tgz
          if-no-files-found: error
          retention-days: 1

  canary-publish:
    name: Publish canary
    needs: canary-pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deployment branches: main only. Registered on npm as the canary trusted publisher.
    environment: npm-canary
    permissions:
      contents: read
      # npm trusted publishing (OIDC), see `publish`.
      id-token: write

    steps:
      # Same Node as everywhere else, taken from .nvmrc by the pack job: this job has
      # no checkout on purpose.
      - name: Set up npm
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.canary-pack.outputs.node-version }}
          package-manager-cache: false

      - name: Check npm version
        run: |
          have=$(npm --version)
          if ! printf '11.5.1\n%s\n' "$have" | sort -V -C; then
            echo "::error::npm $have is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi

      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.canary-pack.outputs.artifact-id }}
          path: canary
          merge-multiple: true

      # No checkout and no install: the only input is the tarball built above, and
      # provenance is attached automatically under trusted publishing.
      - name: Publish
        env:
          TAG: ${{ needs.canary-pack.outputs.tag }}
        run: npm publish canary/*.tgz --tag="$TAG"
