name: Changesets
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares exactly what it needs. Only `publish` gets `id-token: write`, and
# it runs in the `npm-release` environment, whose deployment-branch policy limits which
# refs may reach it. npm's trusted publisher for this file names that environment, so a
# publish from any other ref or environment is refused by the registry.
#
# The canary lives in canary.yml: npm allows one trusted publisher per workflow file,
# so the two publishers need two files.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be halfway through a publish.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # `version` when changesets are pending, `publish` when the versioned package is not
      # on npm yet, `none` otherwise.
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Create version pull request
    if: github.ref == 'refs/heads/main' && needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # Commits and pushes through the GitHub API, so no git credentials are needed.
      - name: Create version pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run changeset:version
          commit-message: 'chore: version package'
          pr-title: 'chore: version package'

  pack:
    name: Pack
    if: github.ref == 'refs/heads/main' && needs.select-mode.outputs.mode == 'publish'
    needs: [verify, select-mode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deployment branches: main only. Registered on npm as the release trusted publisher.
    environment: npm-release
    permissions:
      # Pushes the release tag and creates the GitHub release.
      contents: write
      # npm trusted publishing (OIDC). No NPM_TOKEN secret is involved.
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache on a job that holds the publish credential.
      - name: Set up npm
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 bundles a newer one; fail
      # loudly rather than silently install whatever `npm@latest` is on the day. Plain
      # coreutils on purpose: nothing fetched from the registry runs next to the credential.
      - name: Check npm version
        run: |
          have=$(npm --version)
          if ! printf '11.5.1\n%s\n' "$have" | sort -V -C; then
            echo "::error::npm $have is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi

      # Only @changesets/cli runs here, and it publishes the tarball from the pack job.
      # Root workspace only, no install scripts: roughly a hundred packages instead of
      # the whole monorepo tree, and no third-party script runs next to the credential.
      - name: Install dependencies
        run: npm ci --workspaces=false --ignore-scripts

      # Publishes the tarballs from the pack job, then tags the commit and creates the
      # GitHub release. The dist-tag comes from the publish plan: `beta` while
      # .changeset/pre.json is in pre mode.
      - name: Publish
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true

      # Trusted publishing attaches a provenance attestation on its own; make sure it
      # actually did, so a silent fallback to an unattested publish cannot go unnoticed.
      - name: Verify provenance
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          for spec in $(printf '%s' "$PUBLISHED" | jq -r '.[] | "\(.name)@\(.version)"'); do
            for attempt in 1 2 3 4 5 6; do
              url=$(npm view "$spec" dist.attestations.url 2>/dev/null || true)
              [ -n "$url" ] && break
              sleep 10
            done
            if [ -z "$url" ]; then
              echo "::error::$spec was published without a provenance attestation"
              exit 1
            fi
            echo "$spec: $url"
          done
