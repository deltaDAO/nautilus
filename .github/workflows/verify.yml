name: Verify
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # `biome check` reports and exits non-zero. Do not use the writing forms
      # (`format --write` / `check --fix`) here: they mutate a throwaway checkout
      # and always exit 0, which makes the gate incapable of failing.
      - name: Lint code
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: npm run build

  types:
    name: Types
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 5.9 is what the repo builds with (see the `typescript` devDependency) and the
        # floor for consumers of the published .d.ts. `latest` is TypeScript 7, the native
        # compiler: the library typechecks clean under it, but the repo cannot adopt it yet
        # because vocs' twoslash needs the JS TypeScript API that 7 dropped. Keeping it in
        # the matrix guards that forward-compatibility until the docs can follow.
        typescript-version: ['5.9', 'latest']

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - run: npm i -D --no-save typescript@${{ matrix.typescript-version }}

      - name: Check types
        run: npm run typecheck

  examples:
    name: Examples
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # `examples` is deliberately not a workspace — it resolves nautilus the way a
      # consumer does, through `src/package.json`'s exports map. That map points at
      # `_esm` and `_types`, so the library has to be built before the examples can
      # even be installed, let alone typechecked.
      - name: Build nautilus
        run: npm run build

      - name: Install examples
        run: npm ci
        working-directory: examples

      # The examples are the widest exercise of the public v2 API, so this is where
      # API drift surfaces while 2.0.0 is still in beta.
      - name: Check types
        run: npm run typecheck
        working-directory: examples

  # The examples otherwise only typecheck, which misses a command that now throws or
  # prints the wrong thing. This runs a fixed set of them in-process against the unit
  # suite's node mock and chain stubs, plus a local stub for the RPC, IPFS and a file
  # (examples/smoke/smoke.test.ts): a publish, a download, two compute commands
  # (environments, job status), the gated SSI publish and a revoke. Starting a compute
  # job, walt.id presentations and real contracts or indexing are not covered here; those
  # run manually on the dev stack.
  examples-smoke:
    name: Examples smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # The examples install nautilus from `src/` through its exports map, which points at
      # the build (see the Examples job). The smoke itself runs against the source.
      - name: Build nautilus
        run: npm run build

      - name: Install examples
        run: npm ci
        working-directory: examples

      - name: Run the example commands
        run: npm run examples:smoke

  # The docs pages carry type-checked `ts twoslash` samples; a sample that no longer
  # compiles against the API fails the build, so the docs cannot drift from the code.
  docs:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build docs
        run: npm run docs:build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # No retry wrapper: these are deterministic unit tests, so a retry would
      # hide a real failure rather than work around genuine flakiness.
      - name: Run tests
        run: npm run test:unit:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
