name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # `biome check` reports and exits non-zero. Do not use the writing forms
      # (`format --write` / `check --fix`) here: they mutate a throwaway checkout
      # and always exit 0, which makes the gate incapable of failing.
      - name: Lint code
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: npm run build

  types:
    name: Types
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 5.9 is what the repo builds with (see the `typescript` devDependency) and the
        # floor for consumers of the published .d.ts. `latest` is TypeScript 7, the native
        # compiler: the library typechecks clean under it, but the repo cannot adopt it yet
        # because vocs' twoslash needs the JS TypeScript API that 7 dropped. Keeping it in
        # the matrix guards that forward-compatibility until the docs can follow.
        typescript-version: ['5.9', 'latest']

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - run: npm i -D --no-save typescript@${{ matrix.typescript-version }}

      - name: Check types
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # No retry wrapper: these are deterministic unit tests, so a retry would
      # hide a real failure rather than work around genuine flakiness.
      - name: Run tests
        run: npm run test:unit:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
